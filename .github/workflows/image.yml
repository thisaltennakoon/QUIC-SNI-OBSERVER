name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/thisaltennakoon/quic-sni-observer

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test the script without Docker
        run: |
          python -m pip install cryptography
          python read_sni.py | tee out.txt
          grep -q "server name: example.com" out.txt

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build a test image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: quic-sni-observer:test

      - name: Test the image
        run: |
          docker run --rm quic-sni-observer:test | tee out1.txt
          docker run --rm -i quic-sni-observer:test - < client_initial.txt | tee out2.txt
          docker run --rm quic-sni-observer:test --hex "$(tr -d ' \n' < client_initial.txt)" | tee out3.txt
          grep -q "server name: example.com" out1.txt
          grep -q "server name: example.com" out2.txt
          grep -q "server name: example.com" out3.txt
          SIZE=$(docker image inspect quic-sni-observer:test --format '{{.Size}}')
          echo "::notice title=Image size::$((SIZE / 1000000)) MB uncompressed (linux/amd64)"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Decrypts a QUIC v1 client Initial packet with public values and prints the server name (SNI).
